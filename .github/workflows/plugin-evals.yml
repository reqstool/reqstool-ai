name: Plugin Evals

# Manual only: every run is billed to the ANTHROPIC_API_KEY secret.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: Runs per case per arm
        default: "3"
      threshold:
        description: Minimum with-plugin score per case (0..1)
        default: "0.8"
      max_cost_usd:
        description: Cost ceiling per plugin (USD)
        default: "15"

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [reqstool, reqstool-openspec]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24.21.0"

      - name: Install Claude Code
        # renovate: datasource=npm depName=@anthropic-ai/claude-code
        run: npm install -g @anthropic-ai/claude-code@2.1.283

      - name: Run evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PLUGIN: ${{ matrix.plugin }}
          RUNS: ${{ inputs.runs }}
          THRESHOLD: ${{ inputs.threshold }}
          MAX_COST_USD: ${{ inputs.max_cost_usd }}
        run: |
          claude plugin eval "plugins/$PLUGIN" \
            --scaffold \
            --allow-tools Write Edit \
            --trust-plugin \
            --runs "$RUNS" \
            --threshold "$THRESHOLD" \
            --model claude-sonnet-5-5 \
            --judge-model claude-haiku-4-5 \
            --max-cost-usd "$MAX_COST_USD" \
            --no-publish \
            --json eval-results.json \
            --report eval-report.html

      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: eval-${{ matrix.plugin }}
          path: |
            eval-results.json
            eval-report.html
